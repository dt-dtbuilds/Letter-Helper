<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Helper</title>
<style>
  :root {
    --sky: #4FA8E0;
    --sun: #FFC94D;
    --grass: #5BBF6A;
    --coral: #FF7B6B;
    --ink: #2B2B33;
    --cream: #FFFDF6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
    background: linear-gradient(170deg, var(--sky) 0%, #8FD0F0 45%, #C9EEDA 100%);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    user-select: none;
  }

  /* Display area where big letters show */
  .display {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    align-content: center;
    gap: 0.05em;
    padding: 16px;
    overflow: hidden;
    position: relative;
  }

  .letter {
    font-size: clamp(60px, 22vw, 220px);
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    background: var(--cream);
    border-radius: 18px;
    padding: 0.04em 0.16em;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 12px 24px rgba(0,0,0,0.18);
    animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.5, 1) both;
    text-transform: none;
  }
  .letter.cap { color: var(--coral); }
  .letter.space { background: transparent; box-shadow: none; width: 0.3em; }

  @keyframes pop {
    from { transform: scale(0) rotate(-8deg); opacity: 0; }
    to   { transform: scale(1) rotate(0); opacity: 1; }
  }

  .placeholder {
    text-align: center;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .placeholder .big { font-size: clamp(40px, 9vw, 80px); margin-bottom: 8px; }
  .placeholder .small { font-size: clamp(20px, 4.5vw, 32px); font-weight: 700; }

  /* Bottom control bar */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(6px);
  }

  .btn {
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    color: var(--cream);
  }
  .btn:active { transform: scale(0.92); }

  .mic {
    width: clamp(90px, 26vw, 120px);
    height: clamp(90px, 26vw, 120px);
    background: var(--grass);
    box-shadow: 0 8px 0 #3f9a4d, 0 10px 20px rgba(0,0,0,0.25);
  }
  .mic svg { width: 48%; height: 48%; }

  .mic.listening {
    background: var(--coral);
    box-shadow: 0 8px 0 #d85a4c, 0 10px 20px rgba(0,0,0,0.25);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .clear {
    width: clamp(64px, 18vw, 84px);
    height: clamp(64px, 18vw, 84px);
    background: var(--sun);
    box-shadow: 0 6px 0 #d9a838, 0 8px 16px rgba(0,0,0,0.2);
  }
  .clear svg { width: 50%; height: 50%; }

  .hint {
    position: absolute;
    top: 18px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.9);
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .error {
    color: var(--ink);
    background: var(--sun);
    padding: 14px 20px;
    border-radius: 14px;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700;
    text-align: center;
    max-width: 90%;
  }
</style>
</head>
<body>
  <div class="display" id="display">
    <div class="hint" id="hint"></div>
    <div class="placeholder" id="placeholder">
      <div class="big">👇 🎤</div>
      <div class="small">Tap the green button<br>and say a name!</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn mic" id="micBtn" aria-label="Speak">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M17 11a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0z"/>
      </svg>
    </button>
    <button class="btn clear" id="clearBtn" aria-label="Clear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      </svg>
    </button>
  </div>

<script>
  const display = document.getElementById('display');
  const placeholder = document.getElementById('placeholder');
  const hint = document.getElementById('hint');
  const micBtn = document.getElementById('micBtn');
  const clearBtn = document.getElementById('clearBtn');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  function showError(msg) {
    placeholder.style.display = 'none';
    [...display.querySelectorAll('.letter, .error')].forEach(e => e.remove());
    const e = document.createElement('div');
    e.className = 'error';
    e.textContent = msg;
    display.appendChild(e);
  }

  function renderText(text) {
    placeholder.style.display = 'none';
    [...display.querySelectorAll('.letter, .error')].forEach(e => e.remove());

    const chars = text.split('');
    chars.forEach((ch, i) => {
      const span = document.createElement('div');
      if (ch === ' ') {
        span.className = 'letter space';
      } else {
        span.className = 'letter';
        if (ch >= 'A' && ch <= 'Z') span.classList.add('cap');
        span.textContent = ch;
      }
      span.style.animationDelay = (i * 0.06) + 's';
      display.appendChild(span);
    });
  }

  // Capitalize first letter of each word so names look right
  function tidy(raw) {
    return raw
      .trim()
      .replace(/\s+/g, ' ')
      .split(' ')
      .map(w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w)
      .join(' ');
  }

  function startListening() {
    if (!SR || !navigator.mediaDevices) {
      showError("Open this file in Chrome or Safari to use the microphone.");
      return;
    }
    if (listening) { recognition.stop(); return; }

    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
      hint.textContent = '👂 Listening...';
      hint.style.opacity = '1';
    };
    recognition.onresult = (ev) => {
      const text = tidy(ev.results[0][0].transcript);
      if (text) renderText(text);
    };
    recognition.onerror = (ev) => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        showError("Please allow the microphone, then tap again.");
      } else if (ev.error === 'no-speech') {
        hint.textContent = "I didn't hear you. Try again!";
      }
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      setTimeout(() => { hint.style.opacity = '0'; }, 1200);
    };

    try { recognition.start(); } catch (e) {}
  }

  function clearAll() {
    [...display.querySelectorAll('.letter, .error')].forEach(e => e.remove());
    placeholder.style.display = 'block';
    hint.style.opacity = '0';
  }

  micBtn.addEventListener('click', startListening);
  clearBtn.addEventListener('click', clearAll);
</script>
</body>
</html>
